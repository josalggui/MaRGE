job:
  codespec:
    image: acr-proxy.tyger.cloud/tygertepimages.azurecr.io/tinker:16f9c70-cuda-amd64
    buffers:
      inputs:
        - input
        - noisecovariance
      outputs:
        - recon
    args:
      - "recon"
      - "--input"
      - "$(INPUT_PIPE)"
      - "--noise.noise-covariance"
      - "$(NOISECOVARIANCE_PIPE)"
      - "--output"
      - "$(RECON_PIPE)"
      - "--kspace-filter.sigma"
      - "1.0"
      - "--denoising.model-file"
      - "/app/models/denoising/model_219m_with_ellipse_pf.pts"
      - "--log-level"
      - "DEBUG"
      - "--dtype.data-type"
      - "float32"
    resources:
      requests:
        cpu: 4
      gpu: 1
  nodepool: gpunp3
